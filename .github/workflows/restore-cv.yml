name: restore-cv
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore CV pdf
        run: |
          curl -fsSL "https://gist.githubusercontent.com/Omartarek876/d22c4640cfa0d2e2a671a0e63dfbcbf0/raw/cv.b64" -o cv.b64
          base64 -d cv.b64 > Omar-Tarek-CV.pdf
          git config user.name "Omar Tarek"
          git config user.email "ot482002@gmail.com"
          git add Omar-Tarek-CV.pdf
          git commit -m "Update Omar-Tarek-CV.pdf to latest version" || echo "no changes"
          git push
